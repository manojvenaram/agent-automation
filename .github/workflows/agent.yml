name: Autonomous Shorts Agent

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

jobs:
  produce-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous Shorts Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENVIRONMENT: "production"
          AUTO_PUBLISH: "true"
          RENDER_MODE: "low_resource"
        run: python auto_run.py

      - name: Upload Rendered Artifacts (If Not Published)
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: projects/**/render/final.mp4
          retention-days: 7
