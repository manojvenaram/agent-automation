name: Autonomous YouTube Shorts Generator

on:
  schedule:
    # Runs at 18:00 UTC every day (adjust as needed)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category (e.g., technology, science, space, humor)'
        required: false
        default: 'technology'
      topic:
        description: 'Specific topic (optional)'
        required: false
        default: ''
      format:
        description: 'Video Format (short, long, VIRAL_PROMPT, etc.)'
        required: false
        default: 'short'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          ENVIRONMENT: production
          AUTO_PUBLISH: true
          # Pulling keys from GitHub Secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_SECRETS_B64: ${{ secrets.GOOGLE_CLIENT_SECRETS_B64 }}
          GOOGLE_TOKEN_PICKLE_B64: ${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}
        run: |
          # 1. Run the fully autonomous engine
          python auto_run.py

      - name: Persist Memory Database
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add shorts_agent.db
          git commit -m "chore: update agent memory with new video topic" || echo "No changes to commit"
          git push

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-shorts
          path: tmp/*.mp4
