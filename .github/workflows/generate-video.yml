name: Autonomous Video Generation

on:
  schedule:
    # Runs automatically 4 times a day (every 6 hours)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the video (optional)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        visual_style: ['cartoon', 'stickman']

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_PROVIDER: groq
      ENVIRONMENT: production
      DEBUG: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu imagemagick libcairo2-dev libpango1.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Autonomous Agent
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ "${{ matrix.visual_style }}" == "stickman" ]; then
            if [ -n "$TOPIC" ]; then
              python app.py run-agent --category "science" --topic "$TOPIC (Format as Whiteboard Stickman Explainer)"
            else
              python app.py run-agent --category "science" --topic "A fascinating science fact explained in a Whiteboard Stickman Explainer format"
            fi
          else
            if [ -n "$TOPIC" ]; then
              python app.py run-agent --category "science" --topic "$TOPIC (Format as Cartoon Vector Animation)"
            else
              python app.py run-agent --category "science" --topic "A fascinating science fact explained in a Cartoon Vector Animation format"
            fi
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ matrix.visual_style }}
          path: projects/*/visuals/*.mp4
          if-no-files-found: ignore

      - name: Upload Project Folder (Debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-project-${{ matrix.visual_style }}
          path: projects/
          if-no-files-found: ignore
